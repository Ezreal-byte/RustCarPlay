[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
default-members = ["apps/carplay-cli"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
plist = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
