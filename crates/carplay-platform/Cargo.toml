[package]
name = "carplay-platform"
version = "0.1.0"
edition = "2024"
description = "Native host diagnostics and transport boundaries for RustCarplay"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
socket2 = { version = "0.6", features = ["all"] }
uuid = { version = "1", features = ["serde"] }
zeroize = "1.8"
quick-xml = "0.42"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
nusb = "0.2.7"
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.10"
windows = { version = "0.58", features = ["Foundation", "Networking_Connectivity", "Networking_NetworkOperators", "Win32_System_Com", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Bluetooth", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
