[package]
name = "carplay-auth"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
description = "CarPlay accessory authentication and AirPlay pairing primitives"

[dependencies]
aes = "0.8.4"
chacha20poly1305 = "0.10.1"
cms = "0.2.3"
crypto-bigint = { version = "0.5.5", features = ["zeroize"] }
ctr = "0.9.2"
der = { version = "0.7.10", features = ["alloc", "std"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
hkdf = "0.12.4"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
x509-cert = "0.2.5"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
num-bigint = "0.4.6"
rcgen = "0.13.2"
tempfile = "3"
